name: Publish source
on:
  push:
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish source
        shell: bash
        run: |
          set -euo pipefail
          : > source.tar.xz
          for f in .bootstrap-parts/*.txt; do
            echo "Decoding $f"
            if ! tr -d '\r\n' < "$f" | base64 -d >> source.tar.xz; then
              echo "Invalid Base64 in $f"
              exit 1
            fi
          done
          echo "a7aa3b180b17bf26adc5569ca00bef15fe7329f1206b9345eb9d98cf704ea9b4  source.tar.xz" | sha256sum -c -
          xz -dc source.tar.xz | tar -xf -
          find . -maxdepth 1 -type d -name '.bootstrap*' -exec rm -rf {} +
          rm -f source.tar.xz .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish project source"
          git push

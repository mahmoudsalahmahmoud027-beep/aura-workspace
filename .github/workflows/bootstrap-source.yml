name: Bootstrap source
on:
  push:
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-xz/*.txt | tr -d '\r\n' | base64 -d > source.tar.xz
          xz -dc source.tar.xz | tar -xf -
          rm -rf .bootstrap-xz .bootstrap source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: publish project source"
          git push
# trigger: complete archive

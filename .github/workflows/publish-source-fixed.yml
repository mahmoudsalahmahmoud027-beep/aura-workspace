name: Publish clean source fixed
on:
  push:
    paths:
      - ".github/workflows/publish-source-fixed.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish source
        shell: bash
        run: |
          set -euo pipefail
          : > source.zip
          for f in .bootstrap-clean/000.txt .bootstrap-clean/001.txt .bootstrap-clean/002.txt .bootstrap-clean/003.txt .bootstrap-clean/004a.txt .bootstrap-clean/004b.txt .bootstrap-clean/005.txt; do
            tr -d '\r\n' < "$f" | base64 -d >> source.zip
          done
          echo "a0cfb2f0eeb18811d97d21c11d6f178540ae071af475cf325cc147759e2df9dd  source.zip" | sha256sum -c -
          unzip -o source.zip
          rm -rf .bootstrap-clean .bootstrap .bootstrap-xz .bootstrap-parts
          rm -f source.zip .github/workflows/publish-source.yml .github/workflows/publish-source-fixed.yml .github/workflows/bootstrap-source.yml .tmp-marker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish project source"
          git push

name: Publish clean source
on:
  push:
    paths:
      - ".github/workflows/publish-source.yml"
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap-clean/*.txt | tr -d '\r\n' | base64 -d > source.zip
          echo "a0cfb2f0eeb18811d97d21c11d6f178540ae071af475cf325cc147759e2df9dd  source.zip" | sha256sum -c -
          unzip -o source.zip
          rm -rf .bootstrap-clean .bootstrap .bootstrap-xz .bootstrap-parts
          rm -f source.zip .github/workflows/publish-source.yml .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish project source"
          git push
